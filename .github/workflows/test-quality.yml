name: Test Quality

on:
  pull_request:
    paths:
      - "backend/**"
      - "docs/architecture/STRUCTURE_AUDIT.md"
      - "docs/architecture/architecture-debt-inventory.json"
      - "docs/architecture/structure-audit.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/test-quality.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      contract_fuzz_profile:
        description: "Contract fuzz profile"
        type: choice
        required: false
        default: "full"
        options:
          - "fast"
          - "full"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "20"
  UV_VERSION: "0.10.9"
  PYTEST_PROFILE: pr
  PYTEST_WORKERS: "2"
  PYTEST_DIST: worksteal
  CONTRACT_FUZZ_PROFILE: ${{ github.event_name == 'pull_request' && 'fast' || (github.event_name == 'workflow_dispatch' && inputs.contract_fuzz_profile || 'full') }}

jobs:
  lint-format:
    name: lint-format
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install locked backend dependencies
        run: |
          python -m pip install uv==${{ env.UV_VERSION }}
          uv sync --locked --extra lint
      - name: Require tests for new backend production files
        run: uv run python scripts/require_tests_for_new_backend_files.py --base origin/${{ github.base_ref }}
      - name: Ruff lint
        run: uv run ruff check . --output-format=github
      - name: Ruff format check
        run: uv run ruff format --check .

  typecheck:
    name: typecheck
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install locked backend dependencies
        run: |
          python -m pip install uv==${{ env.UV_VERSION }}
          uv sync --locked --extra typecheck
      - name: Pyright scoped type check
        run: uv run pyright app/api app/services app/schemas.py app/config.py app/workers
      - name: Pyright full strict report
        run: uv run pyright

  backend-tests:
    name: backend-tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install locked backend dependencies
        run: |
          python -m pip install uv==${{ env.UV_VERSION }}
          uv sync --locked --extra test
      - name: Prepare reports directory
        run: mkdir -p reports
      - name: Resolve canonical PR marker expression
        # Single source of truth (#264): scripts/pytest_profiles.py.
        run: |
          PR_MARKER_EXPR="$(uv run python -m scripts.pytest_profiles pr-markers)"
          echo "PR_MARKER_EXPR=${PR_MARKER_EXPR}" | tee -a "$GITHUB_ENV"
          echo "pr_marker_expr=${PR_MARKER_EXPR}" | tee reports/pytest-runtime-summary.txt
      - name: Run tests with coverage
        run: |
          set -o pipefail
          {
            echo "pytest_profile=${PYTEST_PROFILE}"
            echo "pytest_workers=${PYTEST_WORKERS}"
            echo "pytest_dist=${PYTEST_DIST}"
          } | tee -a reports/pytest-runtime-summary.txt
          /usr/bin/time -f "pytest_total_seconds=%e" -o reports/pytest-time.txt \
            uv run pytest tests \
              --ignore=tests/contract \
              -n "${PYTEST_WORKERS}" --dist="${PYTEST_DIST}" \
              -m "${PR_MARKER_EXPR}" \
              --cov=app --cov=tools --cov-branch --cov-context=test \
              --cov-report=json:reports/coverage.json \
              --cov-report=xml:reports/coverage.xml \
              --cov-report=term-missing:skip-covered \
              --benchmark-disable \
              --durations=50 --durations-min=0.5 \
              -q 2>&1 | tee reports/pytest.log
          cat reports/pytest-time.txt | tee -a reports/pytest-runtime-summary.txt
        env:
          APP_ENV: test
          AUTH_MODE: local
      - name: Build slow-test report
        if: always()
        run: |
          /usr/bin/time -f "slow_report_seconds=%e" -o reports/slow-report-time.txt \
            uv run python scripts/report_slow_tests.py \
              --log reports/pytest.log \
              --output reports/slow-tests.json \
              --threshold 3 \
              --threshold 5 \
              --threshold 10
          cat reports/slow-report-time.txt | tee -a reports/pytest-runtime-summary.txt
      - name: Enforce slow-test budget (#264)
        # PR profile budget: unmarked tests exceeding 3s call / 2s setup fail.
        # --require-report guarantees the budget gate fails (exit 2) if
        # report_slow_tests.py is broken, so a missing report cannot silently
        # disable the gate.
        run: |
          uv run python scripts/enforce_slow_test_budget.py \
            --report reports/slow-tests.json \
            --max-call-seconds 3 \
            --max-setup-seconds 2 \
            --profile pr \
            --require-report
      - name: Audit fixture usage
        # Zero-soft-fail policy (#262): fixture audit hard-fails. Artifact upload below
        # uses `if: always()` to preserve the JSON for diagnosis when this step fails.
        if: always()
        run: |
          /usr/bin/time -f "fixture_audit_seconds=%e" -o reports/fixture-audit-time.txt \
            uv run python scripts/test_fixture_audit.py --path tests --output reports/fixture-audit.json
          cat reports/fixture-audit-time.txt | tee -a reports/pytest-runtime-summary.txt
      - name: Per-package coverage gate
        run: |
          /usr/bin/time -f "coverage_gate_seconds=%e" -o reports/coverage-gate-time.txt \
            uv run python scripts/coverage_gate.py
          cat reports/coverage-gate-time.txt | tee -a reports/pytest-runtime-summary.txt
      - name: Run test quality analyzer
        # Zero-warning policy (#262): any INFO/WARNING/CRITICAL finding fails CI.
        run: |
          /usr/bin/time -f "test_analyzer_seconds=%e" -o reports/test-analyzer-time.txt \
            uv run python -m tools.test_analyzer \
              --path tests \
              --coverage reports/coverage.json \
              --format sarif,json \
              --output-dir reports \
              --severity INFO \
              --fail-on-severity INFO
          cat reports/test-analyzer-time.txt | tee -a reports/pytest-runtime-summary.txt
      - name: Run changed-tests quality analyzer
        # Zero-warning policy (#262): any INFO/WARNING/CRITICAL finding fails CI.
        run: |
          /usr/bin/time -f "changed_test_analyzer_seconds=%e" -o reports/changed-test-analyzer-time.txt \
            uv run python -m tools.test_analyzer \
              --path tests \
              --changed origin/${{ github.base_ref }} \
              --coverage reports/coverage.json \
              --format sarif,json \
              --output-dir reports/changed-tests \
              --severity INFO \
              --fail-on-severity INFO
          cat reports/changed-test-analyzer-time.txt | tee -a reports/pytest-runtime-summary.txt
      - name: Build quality snapshot + summary (#275)
        # PR profile requires coverage/analyzer/slow_tests; missing reports
        # flip status='incomplete' and --fail-on-incomplete returns exit 2,
        # so a broken upstream step cannot leave a green dashboard page.
        if: always()
        run: |
          uv run python scripts/quality_dashboard.py \
            --reports-dir reports \
            --output-json reports/quality-snapshot.json \
            --output-md reports/quality-summary.md \
            --profile pr \
            --fail-on-incomplete
          if [ -f reports/quality-summary.md ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat reports/quality-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload backend test reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-quality-reports
          path: |
            backend/reports/coverage.json
            backend/reports/coverage.xml
            backend/reports/test-quality.sarif
            backend/reports/test-quality.json
            backend/reports/changed-tests/test-quality.sarif
            backend/reports/changed-tests/test-quality.json
            backend/reports/slow-tests.json
            backend/reports/fixture-audit.json
            backend/reports/pytest-runtime-summary.txt
            backend/reports/quality-snapshot.json
            backend/reports/quality-summary.md
        if: always()

  audit:
    name: audit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install locked backend dependencies
        run: |
          python -m pip install uv==${{ env.UV_VERSION }}
          uv sync --locked --extra audit --extra lint --extra typecheck --extra test --extra contract --extra mutation --extra complexity
      - name: pip-audit
        run: uv run python -m pip_audit --skip-editable --progress-spinner=off
      - name: Bandit (medium+ severity, non-blocking)
        # Promote to a hard gate after the cleanup pass closes existing findings;
        # see docs/runbooks/dev-environment-setup.md.
        run: uv run python -m bandit -r app -ll -ii
        continue-on-error: true

  duplication:
    name: duplication
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Node quality dependencies
        run: npm ci --ignore-scripts
      - name: Prepare reports directory
        run: mkdir -p backend/reports
      - name: jscpd duplicate detection app
        run: npm exec -- jscpd backend/app --noTips --threshold 2 --reporters json --output backend/reports/jscpd-app
      - name: jscpd duplicate detection tests
        run: npm exec -- jscpd backend/tests --noTips --threshold 5 --reporters json --output backend/reports/jscpd-tests
      - name: Upload duplication reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: duplication-reports
          path: |
            backend/reports/jscpd-app/jscpd-report.json
            backend/reports/jscpd-tests/jscpd-report.json
        if: always()

  contract-fuzz:
    name: contract-fuzz
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install locked backend dependencies
        run: |
          python -m pip install uv==${{ env.UV_VERSION }}
          uv sync --locked --extra contract
      - name: Prepare reports directory
        run: mkdir -p reports
      - name: Schemathesis OpenAPI fuzz
        run: |
          if [ "${CONTRACT_FUZZ_PROFILE}" = "full" ]; then
            export SCHEMATHESIS_MAX_EXAMPLES=5
          else
            export SCHEMATHESIS_MAX_EXAMPLES=1
          fi
          echo "contract_fuzz_profile=${CONTRACT_FUZZ_PROFILE}" | tee reports/contract-fuzz-runtime-summary.txt
          echo "schemathesis_max_examples=${SCHEMATHESIS_MAX_EXAMPLES}" | tee -a reports/contract-fuzz-runtime-summary.txt
          set -o pipefail
          /usr/bin/time -f "contract_fuzz_total_seconds=%e" -o reports/contract-fuzz-time.txt \
          uv run pytest tests/contract/ -m contract \
            -p no:randomly \
            --durations=50 --durations-min=0.5 \
            --tb=short -q \
            --junit-xml=reports/schemathesis-junit.xml
          cat reports/contract-fuzz-time.txt | tee -a reports/contract-fuzz-runtime-summary.txt
        env:
          APP_ENV: test
          AUTH_MODE: local
          REDIS_SOCKET_CONNECT_TIMEOUT_SEC: "0.1"
          REDIS_SOCKET_TIMEOUT_SEC: "0.1"
          REDIS_RETRY_RETRIES: "0"
      - name: Summarize contract fuzz report
        if: always()
        run: |
          if [ -f reports/schemathesis-junit.xml ]; then
            uv run python scripts/summarize_contract_fuzz.py \
              --junit reports/schemathesis-junit.xml \
              --output reports/contract-fuzz-summary.txt \
              --top 20
          fi
      - name: Upload contract fuzz report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-fuzz-reports
          path: |
            backend/reports/schemathesis-junit.xml
            backend/reports/contract-fuzz-runtime-summary.txt
            backend/reports/contract-fuzz-time.txt
            backend/reports/contract-fuzz-summary.txt
        if: always()

  contract-security:
    name: contract-security
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install locked backend contract dependencies
        run: |
          python -m pip install uv==${{ env.UV_VERSION }}
          uv sync --locked --extra contract

      - name: Verify contract tooling imports
        run: |
          uv run python -c "import schemathesis; import schemathesis.checks"

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Run hard security contract subset
        run: |
          uv run pytest tests/contract/security -m contract \
            -p no:randomly \
            --tb=short \
            --junit-xml=reports/contract-security-junit.xml \
            -q
        env:
          APP_ENV: test
          AUTH_MODE: local

      - name: Upload contract security report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-security-reports
          path: backend/reports/contract-security-junit.xml
        if: always()

  test-quality-pr:
    name: test-quality-pr
    if: always() && github.event_name == 'pull_request'
    needs:
      - lint-format
      - typecheck
      - backend-tests
      - audit
      - duplication
      - contract-security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert required quality jobs passed
        run: |
          echo "lint-format:   ${{ needs.lint-format.result }}"
          echo "typecheck:     ${{ needs.typecheck.result }}"
          echo "backend-tests: ${{ needs.backend-tests.result }}"
          echo "audit:         ${{ needs.audit.result }}"
          echo "duplication:   ${{ needs.duplication.result }}"
          echo "contract-security: ${{ needs.contract-security.result }}"
          test "${{ needs.lint-format.result }}" = "success"
          test "${{ needs.typecheck.result }}" = "success"
          test "${{ needs.backend-tests.result }}" = "success"
          test "${{ needs.audit.result }}" = "success"
          test "${{ needs.duplication.result }}" = "success"
          test "${{ needs.contract-security.result }}" = "success"
