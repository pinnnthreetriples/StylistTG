name: Test Quality

on:
  pull_request:
    paths:
      - "backend/**"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------------
  # Backend quality gate
  # ---------------------------------------------------------------------------
  test-quality-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Node quality dependencies
        working-directory: .
        run: npm ci --ignore-scripts

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Prepare reports directory
        run: mkdir -p reports

      # ----- Hard gates (fail the build) --------------------------------------
      - name: Ruff lint
        run: python -m ruff check . --output-format=github

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Pyright scoped type check
        run: python -m pyright app/api app/services app/schemas.py app/config.py app/workers

      - name: Run tests with coverage (random order, parallel)
        run: |
          python -m pytest tests \
            -n auto --dist=loadscope \
            --cov=app --cov=tools --cov-branch --cov-context=test \
            --cov-report=json:reports/coverage.json \
            --cov-report=html:reports/htmlcov \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=term-missing:skip-covered \
            -q
        env:
          APP_ENV: test
          AUTH_MODE: local

      - name: Per-package coverage gate
        run: python scripts/coverage_gate.py

      - name: Run test quality analyzer (strict, fails on any issue)
        run: |
          python -m tools.test_analyzer \
            --path tests \
            --coverage reports/coverage.json \
            --format sarif \
            --output reports/test-quality.sarif \
            --severity INFO

      - name: Run test quality analyzer (JSON)
        run: |
          python -m tools.test_analyzer \
            --path tests \
            --coverage reports/coverage.json \
            --format json \
            --output reports/test-quality.json \
            --severity INFO
        if: always()
        continue-on-error: true

      # ----- Soft gates (visible but don't block yet) -------------------------
      # Full Pyright remains soft while the strict backlog is being drained.
      # The scoped hard gate above protects the production backend surface.
      - name: Pyright full strict report (soft)
        run: python -m pyright
        continue-on-error: true

      # pip-audit: scans the installed environment for known CVEs.
      # --skip-editable: don't try to audit our own editable install.
      # Plain mode (no --strict) returns exit 1 only on real CVEs.
      - name: pip-audit
        run: python -m pip_audit --skip-editable --progress-spinner=off

      # Schemathesis OpenAPI contract fuzz. Currently surfaces a backlog of
      # schema ↔ handler drift; soft until the backlog is drained. Generated
      # report is uploaded as a CI artifact for triage.
      - name: Schemathesis OpenAPI fuzz (soft)
        run: |
          python -m pytest tests/contract/ -m contract \
            -p no:randomly \
            --tb=short -q \
            --junit-xml=reports/schemathesis-junit.xml \
            || true   # backlog tracked separately; do not fail PR builds yet
        env:
          APP_ENV: test
          AUTH_MODE: local
        continue-on-error: true

      - name: jscpd duplicate detection (app)
        working-directory: .
        run: npm exec -- jscpd backend/app --gitignore --noTips --threshold 2 --reporters json --output backend/reports/jscpd-app
        if: always()

      - name: jscpd duplicate detection (tests)
        working-directory: .
        run: npm exec -- jscpd backend/tests --gitignore --noTips --threshold 5 --reporters json --output backend/reports/jscpd-tests
        if: always()

      # SARIF upload disabled — enable code scanning in repo settings first:
      # https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning-for-a-repository
      # - name: Upload SARIF
      #   uses: github/codeql-action/upload-sarif@v4
      #   with:
      #     sarif_file: backend/reports/test-quality.sarif
      #     category: test-quality
      #   if: always()

      - name: Upload reports artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-quality-reports
          path: backend/reports/
        if: always()
