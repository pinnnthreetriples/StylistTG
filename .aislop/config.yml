# AI-generated-code quality guardrails.
# Start with a moderate non-blocking threshold and tighten after triaging false positives.
ci:
  failBelow: 70

exclude:
  - "node_modules"
  - "dist"
  - "build"
  - "coverage"
  - "backend/.venv"
  - "backend/reports"
  - "apps/dashboard/test-results"
  - "apps/dashboard/playwright-report"
  - "reports"
  - "**/*.generated.*"
  - "packages/api-client/src/generated/**"
  # CLI scripts: print-to-stderr + non-zero exit is the canonical
  # pattern; aislop's swallowed-exception heuristic doesn't model
  # entrypoints. Real bugs in these paths surface via CI exit codes.
  # Same rationale for console.log in node CLI scripts under
  # scripts/ and packages/*/scripts/ — output IS the product.
  - "backend/scripts/**"
  - "backend/tools/**"
  - "scripts/**"
  - "packages/*/scripts/**"

# Rule IDs follow the namespaces emitted by aislop@0.10.0:
#   ai-slop/*       — AI-authored code patterns
#   code-quality/*  — duplication, unused declarations, repeated chains
#   complexity/*    — function/file size, nesting, parameter count
# Unknown rule IDs are silently ignored by aislop's config loader
# (RulesSchema is z.record(z.string(), severity)), so the spellings here
# must match the IDs the engines actually emit.
rules:
  ai-slop/narrative-comment: warning
  ai-slop/trivial-comment: warning
  ai-slop/todo-stub: warning
  ai-slop/unsafe-type-assertion: warning  # `as any` and friends
  complexity/function-too-long: warning
  complexity/file-too-large: warning
  code-quality/unused-declaration: warning
  # Auth-state enum string values ("wait_password", "awaiting_password")
  # match backend protocol strings and trip the heuristic. Real secret
  # detection is handled by gitleaks/CI; keep aislop as a soft signal.
  security/hardcoded-secret: warning
