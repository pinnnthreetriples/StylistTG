name: Secrets Scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  GITLEAKS_VERSION: "8.29.0"

jobs:
  gitleaks:
    name: Gitleaks PR diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL "${base_url}/${archive}" -o "/tmp/${archive}"
          curl -sSfL "${base_url}/${checksums}" -o "/tmp/${checksums}"
          (cd /tmp && grep " ${archive}$" "${checksums}" | sha256sum -c -)
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Resolve scan range
        id: range
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before || '' }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "log_opts=--all ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${before}" && "${before}" != "0000000000000000000000000000000000000000" ]]; then
            echo "log_opts=--all ${before}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "log_opts=-1" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan Git diff for secrets
        shell: bash
        run: |
          /tmp/gitleaks git \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --log-opts="${{ steps.range.outputs.log_opts }}" \
            .

      - name: Upload Gitleaks report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && hashFiles('gitleaks.sarif') != ''
        with:
          name: gitleaks-report
          path: gitleaks.sarif

      - name: Upload Gitleaks SARIF
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        if: always() && hashFiles('gitleaks.sarif') != ''
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
