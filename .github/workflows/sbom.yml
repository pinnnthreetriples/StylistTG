name: SBOM

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SYFT_VERSION: "1.42.3"

jobs:
  sbom:
    name: Generate SBOMs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build backend image
        run: |
          for attempt in 1 2 3; do
            docker build -f backend/Dockerfile -t stylisttg-backend:sbom . && exit 0
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done
      - name: Backend Python SBOM
        shell: bash
        run: |
          set -euo pipefail
          syft_dir="/tmp/syft"
          mkdir -p "${syft_dir}"
          archive="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          checksums="syft_${SYFT_VERSION}_checksums.txt"
          base_url="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}"
          curl --retry 5 --retry-all-errors --retry-delay 5 -sSfL "${base_url}/${archive}" -o "/tmp/${archive}"
          curl --retry 5 --retry-all-errors --retry-delay 5 -sSfL "${base_url}/${checksums}" -o "/tmp/${checksums}"
          (cd /tmp && grep " ${archive}$" "${checksums}" | sha256sum -c -)
          tar -xzf "/tmp/${archive}" -C "${syft_dir}" syft
          "${syft_dir}/syft" version
          "${syft_dir}/syft" scan dir:backend -o spdx-json=sbom-backend.spdx.json
      - name: Frontend workspace SBOM
        shell: bash
        run: /tmp/syft/syft scan dir:. -o spdx-json=sbom-frontend.spdx.json
      - name: Backend container SBOM
        shell: bash
        run: /tmp/syft/syft scan docker:stylisttg-backend:sbom -o spdx-json=sbom-container.spdx.json
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-reports
          path: |
            sbom-backend.spdx.json
            sbom-frontend.spdx.json
            sbom-container.spdx.json

