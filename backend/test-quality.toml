[paths]
tests = ["tests"]
source = ["app"]

[pytest]
external_markers = ["live", "integration", "redis", "postgres", "slow", "contract"]
unit_markers = ["unit", "api", "security", "worker", "architecture", "property", "contract"]

[thresholds]
max_assertions_per_test = 12
duplicate_min_lines = 10
duplicate_similarity = 0.90

[severity]
TQA001 = "CRITICAL"
TQA002 = "CRITICAL"
TQA010 = "CRITICAL"
TQA013 = "CRITICAL"
STG001 = "CRITICAL"
STG003 = "WARNING"
STG004 = "INFO"
STG005 = "CRITICAL"
STG010 = "CRITICAL"
TQA004 = "WARNING"
TQA007 = "WARNING"
TQA008 = "WARNING"
TQA030 = "INFO"
TQA040 = "INFO"

[project_rules]
STG001 = true
STG002 = true
STG003 = true
STG004 = true
STG005 = true
STG006 = true
STG007 = true
STG008 = true
STG009 = true
STG010 = true
TQA010 = true
TQA013 = true
TQA020 = true
TQA040 = true
