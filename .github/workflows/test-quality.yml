name: Test Quality

on:
  pull_request:
    paths:
      - "backend/**"
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"  # nightly at 03:00 UTC

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------------
  # PR / push checks
  # ---------------------------------------------------------------------------
  test-quality-pr:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Prepare reports directory
        run: mkdir -p reports

      # ----- Hard gates (fail the build) --------------------------------------
      - name: Ruff lint
        run: python -m ruff check . --output-format=github

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Run tests with coverage (random order, parallel)
        run: |
          python -m pytest tests \
            -n auto --dist=loadscope \
            --cov=app --cov=tools --cov-branch --cov-context=test \
            --cov-report=json:reports/coverage.json \
            --cov-report=html:reports/htmlcov \
            --cov-report=term-missing:skip-covered \
            -q
        env:
          APP_ENV: test
          AUTH_MODE: local

      - name: Per-package coverage gate
        run: python scripts/coverage_gate.py

      - name: Run test quality analyzer (strict, fails on any issue)
        run: |
          python -m tools.test_analyzer \
            --path tests \
            --coverage reports/coverage.json \
            --format sarif \
            --output reports/test-quality.sarif \
            --severity INFO

      - name: Run test quality analyzer (JSON)
        run: |
          python -m tools.test_analyzer \
            --path tests \
            --coverage reports/coverage.json \
            --format json \
            --output reports/test-quality.json \
            --severity INFO
        if: always()
        continue-on-error: true

      # ----- Soft gates (visible but don't block yet) -------------------------
      # Pyright: strict mode surfaces 549 pre-existing errors. Tracked as a
      # dedicated fix-up effort; `continue-on-error` is removed once the backlog
      # is drained. Every PR still sees the current error count.
      - name: Pyright (strict, soft)
        run: python -m pyright
        continue-on-error: true

      # pip-audit: scans the installed environment for known CVEs.
      # --skip-editable: don't try to audit our own editable install.
      # Plain mode (no --strict) returns exit 1 only on real CVEs.
      - name: pip-audit
        run: python -m pip_audit --skip-editable --progress-spinner=off

      # Schemathesis OpenAPI contract fuzz. Currently surfaces a backlog of
      # schema ↔ handler drift; soft until the backlog is drained. Generated
      # report is uploaded as a CI artifact for triage.
      - name: Schemathesis OpenAPI fuzz (soft)
        run: |
          python -m pytest tests/contract/ -m contract \
            -p no:randomly \
            --tb=short -q \
            --junit-xml=reports/schemathesis-junit.xml \
            || true   # backlog tracked separately; do not fail PR builds yet
        env:
          APP_ENV: test
          AUTH_MODE: local
        continue-on-error: true

      - name: jscpd duplicate detection (app)
        run: npx jscpd app --threshold 2 --reporters json --output reports/jscpd-app
        if: always()

      - name: jscpd duplicate detection (tests)
        run: npx jscpd tests --threshold 5 --reporters json --output reports/jscpd-tests
        if: always()

      # SARIF upload disabled — enable code scanning in repo settings first:
      # https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning-for-a-repository
      # - name: Upload SARIF
      #   uses: github/codeql-action/upload-sarif@v4
      #   with:
      #     sarif_file: backend/reports/test-quality.sarif
      #     category: test-quality
      #   if: always()

      - name: Upload reports artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-quality-reports
          path: backend/reports/
        if: always()

  # ---------------------------------------------------------------------------
  # Nightly deep checks
  # ---------------------------------------------------------------------------
  test-quality-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Randomized test run
        run: python -m pytest --randomly-seed=auto -q
        env:
          APP_ENV: test
          AUTH_MODE: local

      - name: Flaky test detection (rerun failures)
        run: python -m pytest --reruns 2 --reruns-delay 1 -q
        env:
          APP_ENV: test
          AUTH_MODE: local

      - name: Mutation testing (mutmut)
        run: |
          python -m mutmut run --max-children 2
          python -m mutmut export-cicd-stats
          python scripts/mutation_gate.py --min-score 65
          python -m mutmut results > reports/mutmut-results.txt
        env:
          APP_ENV: test
          AUTH_MODE: local

      - name: jscpd duplicate detection (app, with HTML report)
        run: npx jscpd app --threshold 2 --reporters json,html --output reports/jscpd-app

      - name: jscpd duplicate detection (tests, with HTML report)
        run: npx jscpd tests --threshold 5 --reporters json,html --output reports/jscpd-tests

      - name: Upload nightly reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-quality-nightly-reports
          path: backend/reports/
        if: always()
