[project]
name = "stylisttg-backend"
version = "0.1.0"
description = "FastAPI backend for StylistTG Telegram profile jobs."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.124.0",
  "uvicorn[standard]>=0.38.0",
  "rq>=2.6.0",
  "redis>=7.1.0",
  "psycopg[binary]>=3.3.0",
  "python-dotenv>=1.2.0",
  "pydantic-settings>=2.12.0",
  "sqlalchemy>=2.0.45",
  "alembic>=1.17.0",
  "pillow>=12.0.0",
  "python-multipart>=0.0.20",
  "cryptography>=43.0.0",
  "boto3>=1.35.0",
  "sentry-sdk[fastapi,rq]>=2.48.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=9.0.0",
  "pytest-cov>=6.0.0",
  "pytest-xdist>=3.6.0",
  "hypothesis>=6.0.0",
  "freezegun>=1.5.0",
  "ruff>=0.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: pure unit tests — no DB, no HTTP, no external services",
  "api: FastAPI endpoint tests via TestClient",
  "security: auth, role, workspace isolation and PII tests",
  "postgres: requires real PostgreSQL",
  "redis: requires real Redis",
  "contract: API/OpenAPI/client contract tests",
  "integration: feature-gated integration tests that require real TDLib credentials and library",
  "live: live environment smoke or verification tests that require external services",
]
