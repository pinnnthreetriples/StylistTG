name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  backend:
    name: Backend (full + coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stylisttg
          POSTGRES_PASSWORD: stylisttg
          POSTGRES_DB: stylisttg_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stylisttg -d stylisttg_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      AUTH_MODE: local
      DB_CONNECTION_MODE: local
      DATABASE_URL: postgresql+psycopg://stylisttg:stylisttg@localhost:5432/stylisttg_ci
      DATABASE_DIRECT_URL: postgresql+psycopg://stylisttg:stylisttg@localhost:5432/stylisttg_ci
      DATABASE_BASE_URL: postgresql+psycopg://stylisttg:stylisttg@localhost:5432
      DATABASE_ADMIN_URL: postgresql://stylisttg:stylisttg@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379/0
      PROFILE_EXECUTION_ADAPTER: mock
      STORIES_TDLIB_LIVE_ENABLED: "false"
      QUEUE_INLINE_FALLBACK_ENABLED: "false"
      TDLIB_API_ID: "0"
      TDLIB_API_HASH: ""
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Alembic upgrade
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Migration smoke
        working-directory: backend
        run: python -m app.tools.migration_smoke
      - name: Ruff
        working-directory: backend
        run: python -m ruff check .
      - name: Pyright
        working-directory: backend
        run: python -m pyright app/api app/services app/schemas.py app/config.py app/workers
      - name: pip-audit
        working-directory: backend
        run: |
          python -m venv .audit-venv
          . .audit-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip_audit --local
      - name: Pytest with coverage
        working-directory: backend
        run: python -m pytest --cov=app --cov-report=term-missing --cov-report=xml -v
      - name: Compileall
        working-directory: backend
        run: python -m compileall app

  frontend:
    name: Frontend (full)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install frontend dependencies
        run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high
      - name: Install backend dependencies for OpenAPI export
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: OpenAPI drift check
        run: npm run check:api
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  browser-qa:
    name: Browser QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser QA
        run: npm run qa:browser
