name: Complexity

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/complexity.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  xenon:
    name: Xenon complexity (soft)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install uv==0.10.9
          uv sync --locked --extra dev

      - name: Run Xenon complexity report
        id: xenon
        shell: bash
        run: |
          set +e
          uv run xenon --max-absolute B --max-modules A --max-average A app tools scripts 2>&1 | tee reports-xenon.txt
          status=${PIPESTATUS[0]}
          {
            echo "## Xenon complexity"
            echo
            echo "Soft gate: reports complexity debt but does not block merges yet."
            echo
            echo '```'
            cat reports-xenon.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
