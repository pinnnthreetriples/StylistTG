name: Semgrep

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  semgrep:
    name: Semgrep CE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Semgrep CE
        run: python -m pip install semgrep
      - name: Test custom Semgrep rules
        run: |
          mkdir -p .semgrep/tenant-scope-test-config
          cp .semgrep/tenant_scope.yaml .semgrep/tenant-scope-test-config/tenant_scope.yaml
          cp .semgrep/tests/tenant_scope_test.py .semgrep/tenant-scope-test-config/tenant_scope.py
          semgrep --test .semgrep/tenant-scope-test-config
      - name: Run Semgrep
        run: |
          baseline_args=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            baseline_args=(--baseline-commit "origin/${{ github.base_ref }}")
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] && ! [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            baseline_args=(--baseline-commit "${{ github.event.before }}")
          fi
          semgrep scan \
            --config p/ci \
            --config .semgrep/stylisttg.yml \
            --config .semgrep/tenant_scope.yaml \
            "${baseline_args[@]}" \
            --error \
            --sarif \
            --output semgrep.sarif \
            backend/app apps packages
      - name: Upload Semgrep report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          name: semgrep-report
          path: semgrep.sarif

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep
