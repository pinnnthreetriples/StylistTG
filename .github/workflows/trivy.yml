name: Trivy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  filesystem:
    name: Trivy filesystem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Scan repository filesystem
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table

  backend-image:
    name: Trivy backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build backend Docker image
        run: docker build -f backend/Dockerfile -t stylisttg-backend:${{ github.sha }} .

      - name: Prepare Trivy install path
        run: mkdir -p "$HOME/.local/bin"

      - name: Trivy backend CRITICAL gate
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: stylisttg-backend:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table

      - name: Trivy backend HIGH/CRITICAL report
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        if: always()
        continue-on-error: true
        with:
          image-ref: stylisttg-backend:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true
          format: sarif
          output: trivy-backend.sarif

      - name: Upload backend Trivy report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && hashFiles('trivy-backend.sarif') != ''
        with:
          name: trivy-backend-report
          path: trivy-backend.sarif
