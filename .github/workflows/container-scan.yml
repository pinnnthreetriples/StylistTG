name: Container Scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  trivy:
    name: Trivy backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t stylisttg-backend:scan .
      - name: Prepare Trivy install path
        run: mkdir -p "$HOME/.local/bin"
      - name: Trivy CRITICAL gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: stylisttg-backend:scan
          scanners: vuln
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Trivy HIGH/CRITICAL report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: always()
        continue-on-error: true
        with:
          image-ref: stylisttg-backend:scan
          scanners: vuln
          format: sarif
          output: trivy-backend.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true
      - name: Upload Trivy report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && hashFiles('trivy-backend.sarif') != ''
        with:
          name: trivy-backend-report
          path: trivy-backend.sarif
