[project]
name = "stylisttg-backend"
version = "0.1.0"
description = "FastAPI backend for StylistTG Telegram profile jobs."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.124.0",
  "uvicorn[standard]>=0.38.0",
  "rq>=2.6.0",
  "redis>=7.1.0",
  "psycopg[binary]>=3.3.0",
  "python-dotenv>=1.2.0",
  "pydantic-settings>=2.12.0",
  "sqlalchemy>=2.0.45",
  "alembic>=1.17.0",
  "mako>=1.3.12",
  "pillow>=12.2.0",
  "python-multipart>=0.0.27",
  "cryptography>=43.0.0",
  "boto3>=1.35.0",
  "sentry-sdk[fastapi,rq]>=2.48.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=9.0.3",
  "pytest-cov>=6.0.0",
  "pytest-xdist>=3.6.0",
  "pytest-randomly>=3.16.0",
  "pytest-rerunfailures>=14.0",
  "hypothesis>=6.0.0",
  "freezegun>=1.5.0",
  "mutmut>=2.5.0",
  "pip-audit>=2.9.0",
  "pre-commit>=4.0.0",
  # pygments<2.20.0 has CVE-2026-4539; pinned via pytest/rich transitive deps.
  "pygments>=2.20.0",
  "pyright>=1.1.407",
  "ruff>=0.14.0",
  "schemathesis>=4.18.0",
  "xenon>=0.9.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "F", "B", "SIM", "PL", "ARG", "ERA",
  "PT",
]
ignore = [
  "B008",   # function-call-in-default-argument — FastAPI Depends() pattern
  "B009",   # getattr with constant — used for dynamic attribute access in tests
  "PT011",  # pytest.raises too broad — we use match= where practical
  "PT018",  # composite assertion — acceptable in integration tests
  "PLR0911", # too many return statements — acceptable in complex mappers
  "PLR0912", # too many branches — acceptable in complex mappers
  "PLR0913", # too many arguments — common in service functions
  "PLR2004", # magic value comparison — acceptable in tests
  "PLR1714", # consider merging comparisons — readability trade-off
  "PLW0108", # lambda may be unnecessary — common pattern for monkeypatch
  "PLW0603", # global statement — used in module-level singletons
  "PLW2901", # redefined loop name — acceptable in specific patterns
  "SIM105", # use contextlib.suppress — explicit try/except clearer in some cases
  "SIM110", # reimplemented builtin — readability trade-off
  "SIM114", # combine if branches — readability trade-off
  "SIM118", # use `in` for dict membership — false positives
]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["ARG002", "PLC0415", "PLR0915", "SIM102", "SIM108"]
"tests/*" = [
  "ARG001", "ARG002", "ARG004", "ARG005",
  "B007",
  "E501",
  "ERA001",
  "PLC0415", "PLR0913", "PLR0915", "PLR2004",
  "PT001", "PT006", "PT017",
  "SIM102", "SIM108", "SIM117", "SIM300",
]
"app/*" = [
  "ARG001", "ARG002",
  "B007", "B904",
  "E501",
  "ERA001",
  "PLC0208", "PLC0415", "PLR0915",
  "SIM102", "SIM108", "SIM117", "SIM300",
]
"migrations/*" = ["E501", "ERA001"]
"scripts/*" = ["E501"]

[tool.pyright]
include = [
  "app",
  "tools",
]
exclude = [
  "**/__pycache__",
  "**/.pytest_cache",
  "build",
  "dist",
  "migrations/versions",
]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.setuptools.packages.find]
include = ["app*", "tools*"]

[tool.coverage.run]
branch = true
source = ["app", "tools"]
omit = [
  "app/scripts/*",          # CLI smoke utilities, not production runtime
  "app/tdlib_job.py",       # legacy worker entry, deprecated
  "tools/test_analyzer/__main__.py",
  "*/__pycache__/*",
  "*/migrations/versions/*",
]
parallel = false

[tool.coverage.report]
precision = 1
show_missing = true
skip_empty = true
fail_under = 75            # overall floor; per-package thresholds enforced by scripts/coverage_gate.py
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "raise AssertionError",
  "pragma: no cover",
  "^\\s*\\.\\.\\.\\s*$",
  "@overload",
  "@abstractmethod",
]

[tool.coverage.json]
output = "reports/coverage.json"
show_contexts = false

[tool.mutmut]
also_copy = ["app"]
paths_to_mutate = [
  "app/services/secret_redaction.py",
  "app/services/phone_hints.py",
  "app/storage/paths.py",
  "app/services/step_policy.py",
  "app/modules/account_editing/planner.py",
  "app/modules/account_editing/policies.py",
  "app/modules/warmup/policies.py",
]
tests_dir = [
  "tests/security/test_property_security_helpers.py",
  "tests/storage/test_storage_layer.py",
  "tests/domain/test_step_policy.py",
  "tests/accounts/test_account_update_plan.py",
  "tests/modules/test_account_editing_policies.py",
  "tests/modules/account_editing/test_policies.py",
  "tests/warmup/test_warmup_account_integration.py",
  "tests/modules/warmup/test_warmup_legacy_compatibility.py",
  "tests/modules/warmup/test_warmup_policies.py",
]
pytest_add_cli_args = ["-p", "no:randomly"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Strict mode: typo'd markers, unknown config keys, and xfail-that-pass become errors.
strict_config = true
strict_markers = true
xfail_strict = true
addopts = [
  "-ra",                          # show summary for all (incl. skipped/xfailed)
  "--strict-markers",
  "--strict-config",
  "--tb=short",
  "--showlocals",                 # locals in tracebacks help debug AI-written tests
  # Schemathesis contract fuzz lives in tests/contract/ behind the `contract`
  # marker. It currently surfaces a large backlog of OpenAPI ↔ handler drift;
  # excluded from the default suite so the hard gate stays usable, and run as
  # a dedicated soft job (`pytest -m contract`) in CI.
  "-m", "not contract",
]
# Treat warnings as errors. Add targeted ignores ONLY for known-safe third-party noise.
# Anything new = build red until either fixed or explicitly ignored with justification.
filterwarnings = [
  "error",
  # ResourceWarning fires asynchronously from GC of unclosed SQLite connections in
  # in-memory test factories. Ignored project-wide; fixing the leaks is tracked
  # separately (per-fixture engine.dispose()). Real DeprecationWarnings still error.
  "ignore::ResourceWarning",
  # Pytest informational warnings are not actionable for us.
  "ignore::pytest.PytestUnraisableExceptionWarning",
]
markers = [
  "unit: isolated unit-level tests — no HTTP or external services; may use in-memory SQLite",
  "api: FastAPI endpoint tests via TestClient",
  "security: auth, role, workspace isolation and PII tests",
  "postgres: requires real PostgreSQL",
  "redis: requires real Redis",
  "contract: API/OpenAPI/client contract tests",
  "slow: expensive tests that should normally run only in nightly/full CI",
  "integration: feature-gated integration tests that require real TDLib credentials and library",
  "live: live environment smoke or verification tests that require external services",
  "allow_pii_in_logs: opt out of the autouse PII-leak guard (only for tests that verify redaction)",
]
