name: Complexity

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/complexity.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  xenon:
    name: Xenon complexity (soft)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install uv==0.10.9
          uv sync --locked --extra complexity

      - name: Run Xenon complexity report
        id: xenon
        shell: bash
        run: |
          set +e
          uv run xenon --max-absolute B --max-modules A --max-average A app tools scripts 2>&1 | tee reports-xenon.txt
          status=${PIPESTATUS[0]}
          {
            echo "## Xenon complexity"
            echo
            echo "Soft gate: reports complexity debt but does not block merges yet."
            echo
            echo '```'
            cat reports-xenon.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
