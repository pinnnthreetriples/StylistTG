name: Semgrep

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  semgrep:
    name: Semgrep CE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Semgrep CE
        run: python -m pip install semgrep
      - name: Test custom Semgrep rules
        run: |
          mkdir -p .semgrep/tenant-scope-test-config
          cp .semgrep/tenant_scope.yaml .semgrep/tenant-scope-test-config/tenant_scope.yaml
          semgrep test --config .semgrep/tenant-scope-test-config .semgrep/tests
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/ci \
            --config .semgrep/stylisttg.yml \
            --config .semgrep/tenant_scope.yaml \
            --error \
            --sarif \
            --output semgrep.sarif \
            backend/app apps packages
      - name: Upload Semgrep report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          name: semgrep-report
          path: semgrep.sarif

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep
