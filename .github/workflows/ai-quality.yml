name: AI Quality

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "backend/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".aislop/**"
      - ".github/workflows/ai-quality.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  NODE_VERSION: "20"

jobs:
  aislop:
    name: aislop scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install workspace dependencies
        run: npm ci --ignore-scripts
      - name: Run aislop SARIF scan
        run: npm run quality:slop:sarif
        continue-on-error: true
      - name: Upload aislop SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always() && github.event_name != 'pull_request' && hashFiles('reports/aislop.sarif') != ''
        with:
          sarif_file: reports/aislop.sarif
      - name: Upload aislop SARIF artifact
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('reports/aislop.sarif') != ''
        with:
          name: aislop-sarif-report
          path: reports/aislop.sarif

  fallow:
    name: fallow audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install workspace dependencies
        run: npm ci --ignore-scripts
      - name: Run fallow audit
        run: |
          mkdir -p reports
          npm run quality:fallow > reports/fallow-audit.json
        continue-on-error: true
      - name: Upload fallow report
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('reports/fallow-audit.json') != ''
        with:
          name: fallow-audit-report
          path: reports/fallow-audit.json
