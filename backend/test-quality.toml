[paths]
tests = ["tests"]
source = ["app"]

[pytest]
external_markers = ["live", "integration", "redis", "postgres", "slow"]
unit_markers = ["unit", "api", "security", "contract"]

[thresholds]
max_assertions_per_test = 12
duplicate_min_lines = 10
duplicate_similarity = 0.90

[severity]
zero_assertions = "CRITICAL"
assert_true = "CRITICAL"
dependency_overrides_without_finally = "CRITICAL"
external_resource_without_marker = "CRITICAL"
api_4xx_without_error_code = "WARNING"
god_test = "WARNING"
duplicate_setup = "INFO"
missing_edge_case = "WARNING"

[project_rules]
fastapi_error_code_required = true
dependency_overrides_must_use_app_client = true
tdlib_live_tests_require_env_skip = true
s3_stubber_must_use_context_manager = true
rbac_matrix_completeness = true
