name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      browser-qa: ${{ steps.filter.outputs.browser-qa }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          filters: |
            browser-qa:
              - 'apps/dashboard/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
              - 'playwright.config.*'
              - '**/playwright.config.*'
              - '**/e2e/**'

  backend:
    name: Backend (Python 3.12)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stylisttg
          POSTGRES_PASSWORD: stylisttg
          POSTGRES_DB: stylisttg_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stylisttg -d stylisttg_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      AUTH_MODE: local
      DB_CONNECTION_MODE: local
      DATABASE_URL: postgresql+psycopg://stylisttg:stylisttg@localhost:5432/stylisttg_ci
      DATABASE_DIRECT_URL: postgresql+psycopg://stylisttg:stylisttg@localhost:5432/stylisttg_ci
      DATABASE_BASE_URL: postgresql+psycopg://stylisttg:stylisttg@localhost:5432
      DATABASE_ADMIN_URL: postgresql://stylisttg:stylisttg@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379/0
      PROFILE_EXECUTION_ADAPTER: mock
      STORIES_TDLIB_LIVE_ENABLED: "false"
      QUEUE_INLINE_FALLBACK_ENABLED: "false"
      TDLIB_API_ID: "0"
      TDLIB_API_HASH: ""
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install uv==0.10.9
          uv sync --locked --extra dev
      - name: Alembic heads
        working-directory: backend
        run: uv run alembic heads
      - name: Migration safety lint
        working-directory: backend
        run: uv run python -m tools.migration_lint --base origin/main
      - name: Alembic upgrade
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Migration smoke
        working-directory: backend
        run: uv run python -m app.tools.migration_smoke
      - name: Ruff
        working-directory: backend
        run: uv run ruff check . --output-format=github
      - name: pip-audit
        working-directory: backend
        run: |
          uv export --locked --extra dev --format requirements-txt --output-file requirements.audit.txt >/dev/null
          uv run --extra dev python -m pip_audit -r requirements.audit.txt --progress-spinner=off
      - name: Pyright
        working-directory: backend
        run: uv run pyright app/api app/services app/schemas.py app/config.py app/workers
      - name: Pytest
        working-directory: backend
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml
      - name: Compileall
        working-directory: backend
        run: uv run python -m compileall app
      - name: Build backend Docker image
        run: docker build -f backend/Dockerfile -t stylisttg-backend:test .

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install frontend dependencies
        run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high
      - name: Install backend dependencies for OpenAPI export
        working-directory: backend
        run: |
          python -m pip install uv==0.10.9
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: OpenAPI drift check
        run: npm run check:api
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Frontend coverage
        run: npm run coverage
      - name: Build
        run: npm run build

  browser-qa:
    name: Browser QA
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.browser-qa == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --only-shell chromium
      - name: Browser QA
        run: npm run qa:browser
