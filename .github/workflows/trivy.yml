name: Trivy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  filesystem:
    name: Trivy filesystem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Scan repository filesystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table

  backend-image:
    name: Trivy backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build backend Docker image
        run: docker build -f backend/Dockerfile -t stylisttg-backend:${{ github.sha }} .

      - name: Prepare Trivy install path
        run: mkdir -p "$HOME/.local/bin"

      - name: Trivy backend CRITICAL gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: stylisttg-backend:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table

      - name: Trivy backend HIGH/CRITICAL report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: always()
        continue-on-error: true
        with:
          image-ref: stylisttg-backend:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true
          format: sarif
          output: trivy-backend.sarif

      - name: Upload backend Trivy report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && hashFiles('trivy-backend.sarif') != ''
        with:
          name: trivy-backend-report
          path: trivy-backend.sarif

      - name: Upload backend Trivy SARIF
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        if: always() && hashFiles('trivy-backend.sarif') != ''
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

  tdlib-image:
    name: Trivy tdlib image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build tdlib Docker image
        run: docker build -f backend/Dockerfile.tdlib -t stylisttg-tdlib:${{ github.sha }} .

      - name: Prepare Trivy install path
        run: mkdir -p "$HOME/.local/bin"

      - name: Trivy tdlib CRITICAL gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: stylisttg-tdlib:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table

      - name: Trivy tdlib HIGH/CRITICAL report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: always()
        continue-on-error: true
        with:
          image-ref: stylisttg-tdlib:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true
          format: sarif
          output: trivy-tdlib.sarif

      - name: Upload tdlib Trivy artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && hashFiles('trivy-tdlib.sarif') != ''
        with:
          name: trivy-tdlib-report
          path: trivy-tdlib.sarif

      - name: Upload tdlib Trivy SARIF
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        if: always() && hashFiles('trivy-tdlib.sarif') != ''
        with:
          sarif_file: trivy-tdlib.sarif
          category: trivy-tdlib
