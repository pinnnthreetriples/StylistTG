[project]
name = "stylisttg-backend"
version = "0.1.0"
description = "FastAPI backend for StylistTG Telegram profile jobs."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.124.0",
  "uvicorn[standard]>=0.38.0",
  "rq>=2.6.0",
  "redis>=7.1.0",
  "psycopg[binary]>=3.3.0",
  "python-dotenv>=1.2.0",
  "pydantic-settings>=2.12.0",
  "sqlalchemy>=2.0.45",
  "alembic>=1.17.0",
  "pillow>=12.0.0",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=9.0.0",
  "ruff>=0.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: feature-gated integration tests that require real TDLib credentials and library",
  "live: live environment smoke or verification tests that require external services",
]
